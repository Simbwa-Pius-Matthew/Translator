<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d9edf4" />
    <title>Sign in / LUGAFLOW</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <div class="grain" aria-hidden="true"></div>
    <main class="login-shell">
      <p class="login-kicker">LUGAFLOW / Welcome back</p>
      <h1>Keep the conversation moving.</h1>
      <p>Sign-in is being prepared for the Vercel version of LUGAFLOW.</p>
      <form class="login-form" id="loginForm">
        <label for="email"
          >Email address<input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
        /></label>
        <label for="password"
          >Password<input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
        /></label>
        <button class="login-submit" type="submit">
          Sign in <span aria-hidden="true">→</span>
        </button>
      </form>
      <p
        class="login-message"
        id="loginMessage"
        role="status"
        aria-live="polite"
      ></p>
      <a class="back-link" href="index.html">← Back to translator</a>
    </main>
    <script src="login.js"></script>
  </body>
</html>
