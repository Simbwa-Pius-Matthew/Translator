services:
  - type: web
    name: lugaflow
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
